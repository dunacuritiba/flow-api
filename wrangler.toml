name = "flow-api"
main = "dist/main.js"
compatibility_date = "2026-10-15"
compatibility_flags = [ "nodejs_compat" ]

[placement]
mode = "smart"

# Esta regra força o esbuild do Wrangler a ignorar/externalizar os pacotes nativos do Node
# que o nodejs_compat vai injetar em tempo de execução no Cloudflare.
[build]
command = "npm run build"

[vars]

[alias]
"@nestjs/microservices" = "./empty.js"
"@nestjs/microservices/microservices-module.js" = "./empty.js"
"@fastify/static" = "./empty.js"